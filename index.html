<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>坦克大战</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh}
canvas{border:2px solid #444;display:block;background:#1a1a2e}
</style>
</head>
<body>
<canvas id="c" width="728" height="728"></canvas>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const T=28,C=26,R=26,W=728,H=728,TS=40,BS=8;
const _=0,X=1,S=2,B=3;
const up={x:0,y:-1,i:0},dn={x:0,y:1,i:1},lt={x:-1,y:0,i:2},rt={x:1,y:0,i:3};

// Simple 26x26 map
const map=[
[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_],
[_,_,X,X,_,_,X,X,_,_,X,X,S,S,X,X,_,_,X,X,_,_,X,X,_,_],
[_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,_,_,X,X,_,_,_,_,X,X,X,X,X,X,_,_,_,_,X,X,_,_,_,_],
[_,_,_,_,X,X,_,_,_,_,_,_,_,_,_,_,_,_,_,_,X,X,_,_,_,_],
[X,X,_,_,_,_,_,_,X,X,_,_,_,_,_,_,X,X,_,_,_,_,_,_,X,X],
[X,X,_,_,_,_,_,_,X,X,_,_,_,_,_,_,X,X,_,_,_,_,_,_,X,X],
[_,_,_,_,X,X,_,_,_,_,_,_,_,_,_,_,_,_,_,_,X,X,_,_,_,_],
[_,_,_,_,X,X,_,_,_,_,S,_,_,_,_,S,_,_,_,_,X,X,_,_,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_],
[_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_,X,X,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,X,X,_,_,_,_,_,_,X,X,X,X,X,X,_,_,_,_,_,_,X,X,_,_],
[_,_,X,X,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,X,X,_,_],
[_,_,_,_,_,_,X,X,X,X,_,_,_,_,_,_,X,X,X,X,_,_,_,_,_,_],
[_,_,_,_,_,_,X,X,X,X,_,_,_,_,_,_,X,X,X,X,_,_,_,_,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,X,X,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,X,X,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,B,B,_,_,_,_,_,_,_,_,_,_,_,_],
[_,_,_,_,_,_,_,_,_,_,_,_,B,B,_,_,_,_,_,_,_,_,_,_,_,_],
];

let ply={x:112,y:672,dir:up,alive:true,inv:60};
let enemies=[],bullets=[],exps=[];
let keys={},score=0,lives=3,frame=0;
let spawnT=60,spawnI=0,enemyL=20;

function tile(col,row){
  if(col<0||col>=C||row<0||row>=R)return S;
  return map[row]&&map[row][col]!=null?map[row][col]:S;
}
function wallHit(x,y,w,h){
  let sc=Math.floor(x/T),ec=Math.floor((x+w-1)/T);
  let sr=Math.floor(y/T),er=Math.floor((y+h-1)/T);
  for(let r=sr;r<=er;r++)for(let c=sc;c<=ec;c++){
    let t=tile(c,r);
    if(t===X||t===S)return true;
    if(t===B)return true;
  }
  return false;
}
function rectHit(a,b,c,d,e,f,g,h){return a<e+g&&a+c>e&&b<f+h&&b+d>f}
function tankHit(x,y,me){
  if(ply&&ply.alive&&ply!==me&&rectHit(x,y,TS,TS,ply.x,ply.y,TS,TS))return true;
  for(let e of enemies)if(e!==me&&e.alive&&rectHit(x,y,TS,TS,e.x,e.y,TS,TS))return true;
  return false;
}
function ok(x,y,me){return x>=0&&x+TS<=W&&y>=0&&y+TS<=H&&!wallHit(x,y,TS,TS)&&!tankHit(x,y,me)}

function mv(t,x,y){
  if(x===0&&y===0)return;
  let nx=t.x+x,ny=t.y+y;
  if(ok(nx,ny,t)){t.x=nx;t.y=ny;return true;}
  if(x&&ok(nx,t.y-1,t)){t.x=nx;t.y--;return;}
  if(x&&ok(nx,t.y+1,t)){t.x=nx;t.y++;return;}
  if(y&&ok(t.x-1,ny,t)){t.x--;t.y=ny;return;}
  if(y&&ok(t.x+1,ny,t)){t.x++;t.y=ny;return;}
}

function shoot(t){
  if(t.cd)return null;
  let bx=t.x+TS/2-BS/2+t.dir.x*22,by=t.y+TS/2-BS/2+t.dir.y*22;
  if(wallHit(bx,by,BS,BS))return null;
  t.cd=20;
  return{x:bx,y:by,dir:t.dir,spd:5,player:t===ply,alive:true};
}

// spawn enemy
function spawnE(){
  if(enemyL<=0||enemies.filter(e=>e.alive).length>=4)return;
  let pts=[{x:1*T,y:0},{x:11*T,y:0},{x:22*T,y:0}];
  let p=pts[spawnI%3];spawnI++;
  if(ok(p.x,p.y,null)){
    let e={x:p.x,y:p.y,dir:dn,alive:true,spd:1.1+Math.random()*0.4,inv:60,cd:0,aiT:Math.random()*60+30,aiS:Math.random()*60+60};
    enemies.push(e);enemyL--;
  }
}

// draw
function drw(){
  cx.fillStyle='#1a1a2e';cx.fillRect(0,0,W,H);
  // map
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    let x=c*T,y=r*T,t=map[r][c];
    if(t===X){
      cx.fillStyle='#c97a3a';cx.fillRect(x,y,T,T);
      cx.strokeStyle='#8a5020';cx.lineWidth=1;cx.strokeRect(x,y,T,T);
      cx.beginPath();cx.moveTo(x+T/2,y);cx.lineTo(x+T/2,y+T);cx.stroke();
      cx.beginPath();cx.moveTo(x,y+T/2);cx.lineTo(x+T,y+T/2);cx.stroke();
    }else if(t===S){
      cx.fillStyle='#999';cx.fillRect(x,y,T,T);
      cx.strokeStyle='#666';cx.lineWidth=1;cx.strokeRect(x,y,T,T);
      cx.fillStyle='#bbb';cx.fillRect(x+3,y+3,T-6,T-6);
      cx.fillStyle='#888';cx.fillRect(x+5,y+5,T-10,T-10);
    }else if(t===B){
      cx.fillStyle='#222';cx.fillRect(x,y,T,T);
      cx.fillStyle='#ffd700';
      cx.beginPath();
      let cx2=x+T/2,cy2=y+T/2,s=T*0.3;
      cx.moveTo(cx2,cy2-s);cx.lineTo(cx2+s*0.7,cy2+s*0.3);cx.lineTo(cx2+s*0.3,cy2+s*0.3);
      cx.lineTo(cx2+s*0.5,cy2+s);cx.lineTo(cx2-s*0.5,cy2+s);cx.lineTo(cx2-s*0.3,cy2+s*0.3);
      cx.lineTo(cx2-s*0.7,cy2+s*0.3);cx.closePath();cx.fill();
    }
  }
  // tank draw
  function dt(t){
    if(!t||!t.alive)return;
    let flick=t.inv>0&&Math.floor(t.inv/3)%2===0;
    if(!flick){
      let p=t===ply,bc=p?'#4a7a4a':'#8b3a3a',dc=p?'#2d5a2d':'#6b2a2a',lc=p?'#5a9a5a':'#ab4a4a';
      cx.save();cx.translate(t.x+TS/2,t.y+TS/2);cx.rotate(t.dir.i*Math.PI/2);
      cx.fillStyle=dc;cx.fillRect(-TS/2,-TS/2,6,TS);cx.fillRect(TS/2-6,-TS/2,6,TS);
      cx.fillStyle=bc;cx.fillRect(-TS/2+6,-TS/2+4,TS-12,TS-8);
      cx.strokeStyle=dc;cx.lineWidth=1;cx.strokeRect(-TS/2+6,-TS/2+4,TS-12,TS-8);
      cx.fillStyle=lc;cx.beginPath();cx.arc(0,0,TS*0.22,0,Math.PI*2);cx.fill();
      cx.fillStyle=dc;cx.fillRect(-3,-TS/2+3,6,TS*0.35);
      cx.restore();
    }
    if(t.inv>0){
      cx.strokeStyle='rgba(255,255,100,'+(0.4+0.3*Math.sin(t.inv*0.4))+')';
      cx.lineWidth=2;cx.setLineDash([3,3]);
      cx.beginPath();cx.arc(t.x+TS/2,t.y+TS/2,TS/2+4,0,Math.PI*2);cx.stroke();
      cx.setLineDash([]);
    }
  }
  for(let e of enemies)dt(e);
  dt(ply);
  // bullets
  for(let b of bullets)if(b.alive){
    cx.fillStyle=b.player?'#ffd700':'#ff6b6b';
    cx.shadowColor=cx.fillStyle;cx.shadowBlur=6;
    cx.beginPath();cx.arc(b.x+BS/2,b.y+BS/2,BS/2,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;
  }
  // explosions
  for(let e of exps){
    e.f++;
    if(e.f>=e.m)continue;
    let p=e.f/e.m,a=1-p,sz=e.m>12?30:14,r=sz*(0.5+p*0.8);
    let gr=cx.createRadialGradient(e.x+12,e.y+12,0,e.x+12,e.y+12,r);
    gr.addColorStop(0,`rgba(255,255,200,${a})`);
    gr.addColorStop(0.5,`rgba(255,150,50,${a*0.5})`);
    gr.addColorStop(1,`rgba(200,50,0,0)`);
    cx.fillStyle=gr;cx.beginPath();cx.arc(e.x+12,e.y+12,r,0,Math.PI*2);cx.fill();
  }
  exps=exps.filter(e=>e.f<e.m);
  // HUD
  cx.fillStyle='#fff';cx.font='16px Arial';cx.textAlign='left';
  cx.fillText('SCORE: '+score+'  LIVES: '+lives+'  ENEMIES: '+enemyL,10,20);
}

// update
function upd(){
  frame++;
  // player
  if(ply&&ply.alive){
    if(ply.inv>0)ply.inv--;
    if(ply.cd>0)ply.cd--;
    let dx=0,dy=0,nd=ply.dir;
    if(keys['ArrowUp']||keys['w']||keys['W']){dy=-1;nd=up;}
    else if(keys['ArrowDown']||keys['s']||keys['S']){dy=1;nd=dn;}
    else if(keys['ArrowLeft']||keys['a']||keys['A']){dx=-1;nd=lt;}
    else if(keys['ArrowRight']||keys['d']||keys['D']){dx=1;nd=rt;}
    if(dx||dy){ply.dir=nd;mv(ply,dx*2.5,dy*2.5);}
    if(keys[' ']||keys['Space']){let b=shoot(ply);if(b)bullets.push(b);}
  }
  // enemies
  for(let e of enemies){
    if(!e.alive)continue;
    if(e.inv>0)e.inv--;
    if(e.cd>0)e.cd--;
    e.aiT--;
    if(e.aiT<=0){
      let tgt=ply&&ply.alive?{x:ply.x,y:ply.y}:{x:13*T,y:24*T};
      let dx=tgt.x-e.x,dy=tgt.y-e.y;
      let nd=Math.abs(dx)>Math.abs(dy)?(dx>0?rt:lt):(dy>0?dn:up);
      e.dir=nd;e.aiT=Math.random()*60+40;
    }
    mv(e,e.dir.x*e.spd,e.dir.y*e.spd);
    e.aiS--;if(e.aiS<=0){let b=shoot(e);if(b)bullets.push(b);e.aiS=Math.random()*60+60;}
  }
  // spawn
  spawnT--;if(spawnT<=0&&enemyL>0){spawnE();spawnT=80+Math.random()*100;}
  // bullets
  for(let b of bullets){
    if(!b.alive)continue;
    let nx=b.x+b.dir.x*5,ny=b.y+b.dir.y*5;
    if(nx<0||nx+BS>W||ny<0||ny+BS>H){b.alive=false;exps.push({x:nx-12,y:ny-12,f:0,m:10});continue;}
    if(wallHit(nx,ny,BS,BS)){
      let col=Math.floor((nx+BS/2)/T),row=Math.floor((ny+BS/2)/T);
      if(tile(col,row)===X){
        for(let dr=-1;dr<=0;dr++)for(let dc=-1;dc<=0;dc++){
          let tc=col+dc,tr=row+dr;
          if(tc>=0&&tc<C&&tr>=0&&tr<R&&map[tr][tc]===X)map[tr][tc]=_;
        }
        exps.push({x:nx-12,y:ny-12,f:0,m:10});
      }else if(tile(col,row)===S)exps.push({x:nx-8,y:ny-8,f:0,m:6});
      b.alive=false;continue;
    }
    b.x=nx;b.y=ny;
    if(b.player){
      for(let e of enemies){
        if(!e.alive||e.inv>0)continue;
        if(rectHit(b.x,b.y,BS,BS,e.x,e.y,TS,TS)){
          b.alive=false;e.alive=false;
          score+=100;exps.push({x:e.x-16,y:e.y-16,f:0,m:18});break;
        }
      }
    }else if(ply&&ply.alive&&ply.inv<=0&&rectHit(b.x,b.y,BS,BS,ply.x,ply.y,TS,TS)){
      b.alive=false;ply.alive=false;
      lives--;exps.push({x:ply.x-16,y:ply.y-16,f:0,m:18});
      if(lives>0)setTimeout(()=>{ply={x:112,y:672,dir:up,alive:true,inv:90};},1500);
      else{drw();return;}
    }
    // base hit
    let bc=Math.floor((b.x+BS/2)/T),br=Math.floor((b.y+BS/2)/T);
    if(bc>=12&&bc<=13&&br>=24&&br<=25&&tile(bc,br)===B){b.alive=false;exps.push({x:12*T-16,y:24*T-16,f:0,m:20});drw();return;}
  }
  bullets=bullets.filter(b=>b.alive);
  enemies=enemies.filter(e=>e.alive);
  // win?
  if(enemyL<=0&&enemies.length===0){
    cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(0,0,W,H);
    cx.fillStyle='#ffd700';cx.font='bold 48px Arial';cx.textAlign='center';
    cx.fillText('VICTORY!',W/2,H/2);
    return;
  }
  // gameover?
  if(lives<=0&&(!ply||!ply.alive)){
    cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(0,0,W,H);
    cx.fillStyle='#ff4444';cx.font='bold 48px Arial';cx.textAlign='center';
    cx.fillText('GAME OVER',W/2,H/2);
    return;
  }
}

// input
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='Space')e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key]=false});

// loop
function loop(){upd();drw();requestAnimationFrame(loop);}
loop();
</script>
</body>
</html>
